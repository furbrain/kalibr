name: "Ubuntu 24.04 (no ROS)"

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake python3-dev python3-venv \
            python3-numpy python3-scipy python3-matplotlib python3-yaml \
            python3-igraph python3-pyx python3-pil python3-opencv \
            libboost-all-dev libeigen3-dev libsuitesparse-dev libopencv-dev libgtest-dev
      - name: Build (CMake, with C++ tests)
        run: |
          cmake -S . -B build -DPython3_EXECUTABLE=/usr/bin/python3 -DKALIBR_BUILD_TESTS=ON
          cmake --build build -j$(nproc)
      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Install (pip) and smoke test
        run: |
          python3 -m venv --system-site-packages venv
          venv/bin/pip install scikit-build-core rosbags
          venv/bin/pip install --no-build-isolation --no-deps .
          # Regression test: reinstalling with the reused build tree must
          # produce a complete wheel, not an empty one.
          venv/bin/pip install --no-build-isolation --no-deps --force-reinstall .
          venv/bin/python -c "import sm, aslam_cv, kalibr_common, kalibr_camera_calibration"
          export PATH=$PWD/venv/bin:$PATH
          python tests/smoke_test.py
          python tests/smoke_test.py --bag-format ros1
          python tests/smoke_test.py --bag-format ros2-dotbag
          python tests/smoke_test.py --imu
